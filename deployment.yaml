
apiVersion: apps/v1
kind: Deployment
metadata:
  name: week9-registration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: week9-registration
  template:
    metadata:
      labels:
        app: week9-registration
    spec:
      containers:
        - name: week9-registration
          image: harinisundari/week9-registration:v1
          ports:
            - containerPort: 5001
